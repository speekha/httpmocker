buildscript {

    apply from: 'gradle/versions.gradle'

    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

plugins {
    id "org.jlleitschuh.gradle.ktlint" version "$ktlint_version"
    id 'com.vanniktech.maven.publish' version "$vanniktech_publish_version" apply false
    id 'com.google.devtools.ksp' version '2.3.4' apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

subprojects {
    group GROUP
    version VERSION_NAME + (Boolean.valueOf(System.getProperty("snapshot")) ? "-SNAPSHOT" : "")
}

// Apply ktlint only to test and demo modules, not to publishable libraries
configure(subprojects.findAll { it.name in ['tests', 'demo'] }) {
    apply from: '../gradle/ktlint.gradle'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
